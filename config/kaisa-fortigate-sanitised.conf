    next
end

config firewall schedule recurring
    edit "always"
        set day sunday monday tuesday wednesday thursday friday saturday
    next
    edit "WORK_HOUR_AM"
        set start 08:00
        set end 12:00
        set day monday tuesday wednesday thursday friday
    next
    edit "WORK_HOUR_PM"
        set start 13:00
        set end 17:00
        set day monday tuesday wednesday thursday friday
    next
    edit "BREAK"
        set start 12:00
        set end 13:00
        set day monday tuesday wednesday thursday friday
    next
end

config firewall ippool
    edit "IPPOOL_KAISA_SNAT"
        set startip 10.200.2.100
        set endip 10.200.2.120
    next
end

config firewall vip
    edit "VIP_KAISA_WEBSERVER"
        set extip 10.200.2.1
        set mappedip "10.0.1.20"
        set extintf "port2"
        set portforward enable
        set extport 8080
        set mappedport 80
    next
end

config firewall shaper traffic-shaper
    edit "SHAPER_BUSINESS"
        set guaranteed-bandwidth 20000
        set maximum-bandwidth 100000
    next
    edit "SHAPER_NONWORK"
        set guaranteed-bandwidth 1
        set maximum-bandwidth 5000
        set priority low
    next
end

