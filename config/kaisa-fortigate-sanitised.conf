        set ip 10.200.1.1 255.255.255.0
        set allowaccess ping https ssh http fgfm
        set type physical
    next
    edit "port2"
        set ip 10.200.2.1 255.255.255.0
        set allowaccess ping https ssh http
        set type physical
    next
